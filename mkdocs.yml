site_name: Awesome Healthcare Data
site_description: Machine-readable healthcare dataset catalog for ML and analytics
repo_url: https://github.com/adnanmasood/awesome-health-data
theme:
  name: material
  palette:
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - navigation.top
    - content.code.copy
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Access tiers: access-tiers.md
  - PHI guide: phi-guide.md
  - Research method: research-method.md
  - Dataset index: datasets.md
