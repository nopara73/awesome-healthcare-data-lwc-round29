quality_gotchas:
- Generalization is strongest for older Medicare-eligible oncology populations.
- SEER treatment fields and claims treatment ascertainment must be reconciled carefully.
- Cost models need inflation and benefit design handling.
- Right-censoring is central for survival analyses.
