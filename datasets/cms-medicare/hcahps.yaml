quality_gotchas:
- Fee-for-service Medicare is not representative of Medicare Advantage, commercial, Medicaid-only, or uninsured populations.
- Claims completion/runout and annual payment-rule changes can introduce leakage or drift.
- Public-use files are usually aggregated and cannot reconstruct patient-level care pathways.
