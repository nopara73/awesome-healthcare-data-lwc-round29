quality_gotchas:
- Use it for ETL and CI, not for clinical or epidemiologic conclusions.
- Clinical covariance and outcome relationships are intentionally degraded to protect privacy.
- Some modern code systems are absent because the source era predates ICD-10.
common_use_cases:
- cost-prediction
- provider-benchmarking
- readmission-prediction
omop_mapping:
