quality_gotchas:
- Claims runout and adjudication lag make near-real-time modeling difficult.
- The October 2015 ICD-9 to ICD-10 transition requires explicit code-era handling.
- FFS Medicare is older and sicker than commercial populations and excludes Medicare Advantage claims completeness.
- Use MBSF/enrollment files for denominator, plan, dual-eligible, and vital-status logic rather than claims alone.
- Payment and DRG rules change annually and can confound longitudinal cost features.
